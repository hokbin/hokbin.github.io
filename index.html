<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>我的 GitHub 主页</title>
<style>
  :root{
    --bg:#ffffff; --card:#f6f8fa; --border:#d0d7de;
    --text:#1f2328; --muted:#656d76; --accent:#0969da; --radius:14px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    background:var(--bg); color:var(--text); line-height:1.6; padding:0 20px 60px;
  }
  header{
    max-width:900px; margin:0 auto; padding:48px 0 24px;
    text-align:center; border-bottom:1px solid var(--border);
  }
  header img{
    width:96px;height:96px;border-radius:50%;border:1px solid var(--border);
  }
  header h1{margin-top:12px;font-size:28px}
  header p.bio{color:var(--muted);margin-top:6px}
  .links{margin-top:14px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
  .links a{
    text-decoration:none;color:var(--accent);border:1px solid var(--border);
    padding:6px 12px;border-radius:999px;font-size:14px;background:var(--card);
  }
  section{max-width:900px;margin:0 auto;padding-top:36px}
  h2{font-size:20px;margin-bottom:16px}

  .grid{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;
  }
  .card{
    background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
    padding:16px;display:flex;flex-direction:column;gap:8px;transition:.2s;
  }
  .card:hover{border-color:var(--accent);transform:translateY(-2px)}
  .card h3{font-size:16px}
  .card h3 a{color:var(--text);text-decoration:none}
  .card h3 a:hover{color:var(--accent)}
  .card p.desc{font-size:14px;color:var(--muted);min-height:42px}
  .meta{display:flex;align-items:center;gap:12px;font-size:13px;color:var(--muted);flex-wrap:wrap}
  .lang{display:inline-flex;align-items:center;gap:6px}
  .dot{width:10px;height:10px;border-radius:50%;background:#999;display:inline-block}
  .tags{display:flex;gap:6px;flex-wrap:wrap}
  .tag{font-size:12px;background:#eaeef2;border:1px solid var(--border);padding:2px 8px;border-radius:999px;color:var(--muted)}
  .loading,.empty{color:var(--muted);font-size:14px;padding:20px 0}
  .err{color:#cf222e;font-size:14px;padding:20px 0}
  footer{max-width:900px;margin:40px auto 0;text-align:center;color:var(--muted);font-size:13px}
</style>
</head>
<body>

<header>
  <!-- 改这里：头像/昵称/简介 -->
  <img id="avatar" src="https://github.com/hokbin.png" alt="avatar" />
  <h1>HOKBIN</h1>
  <p class="bio">嵌入式 / 硬件 / 电机控制 / 开源玩家</p>
  <div class="links">
    <a href="https://github.com/hokbin" target="_blank" rel="noopener">GitHub</a>
    <a href="mailto:you@example.com">Email</a>
    <a href="https://blog.csdn.net/qq_39312146?spm=1000.2115.3001.5343" target="_blank" rel="noopener">Blog</a>
  </div>
</header>

<section>
  <h2>📦 项目（自动读取 GitHub 仓库）</h2>
  <div id="projects" class="grid">
    <div class="loading">正在从 GitHub 拉取仓库…</div>
  </div>
</section>

<footer>© <span id="year"></span> HOKBIN · Powered by GitHub API</footer>

<script>
/* ========== 配置 ========== */
const GITHUB_USER = 'hokbin';   // ← 只改这里
const MAX_REPOS = 12;              // 最多展示几个
const HIDE_FORKS = true;           // 隐藏 fork
const HIDE_ARCHIVED = true;        // 隐藏归档仓库
const HIDE_NO_DESC = true;         // 隐藏没描述的

/* 语言颜色（GitHub 风格） */
const LANG_COLORS = {
  JavaScript:'#f1e05a', TypeScript:'#3178c6', Python:'#3572A5',
  C:'#555555', 'C++':'#f34b7d', HTML:'#e34c26', CSS:'#563d7c',
  Shell:'#89e051', Go:'#00ADD8', Rust:'#dea584', Java:'#b07219',
  Vue:'#41b883', Dockerfile:'#384d54'
};

/* ========== 工具 ========== */
const $ = (id) => document.getElementById(id);
function el(tag, cls, text){
  const n = document.createElement(tag);
  if(cls) n.className = cls;
  if(text != null) n.textContent = text;   // textContent 防 XSS
  return n;
}
function timeAgo(iso){
  const d = new Date(iso), now = new Date();
  const days = Math.floor((now - d)/86400000);
  if(days <= 0) return '今天更新';
  if(days < 30) return days + ' 天前更新';
  if(days < 365) return Math.floor(days/30) + ' 个月前更新';
  return Math.floor(days/365) + ' 年前更新';
}

/* ========== 拉数据 ========== */
async function loadRepos(){
  const box = $('projects');
  try{
    const res = await fetch(
      `https://api.github.com/users/${GITHUB_USER}/repos?sort=updated&per_page=100`,
      { headers: { 'Accept':'application/vnd.github.v3+json' } }
    );
    if(res.status === 403) throw new Error('GitHub API 限流了（60次/小时），稍后再试');
    if(!res.ok) throw new Error('用户不存在或接口异常：' + res.status);
    let repos = await res.json();

    repos = repos
      .filter(r => !HIDE_FORKS || !r.fork)
      .filter(r => !HIDE_ARCHIVED || !r.archived)
      .filter(r => !HIDE_NO_DESC || (r.description && r.description.trim()))
      .sort((a,b) => b.stargazers_count - a.stargazers_count || new Date(b.pushed_at) - new Date(a.pushed_at))
      .slice(0, MAX_REPOS);

    box.innerHTML = '';
    if(!repos.length){
      box.appendChild(el('div','empty','没有可展示的公开仓库'));
      return;
    }

    repos.forEach(r => {
      const card = el('div','card');

      const h3 = el('h3');
      const a = el('a');
      a.href = r.html_url; a.target = '_blank'; a.rel = 'noopener';
      a.textContent = r.name;
      h3.appendChild(a);

      card.appendChild(h3);
      card.appendChild(el('p','desc', r.description || ''));

      const meta = el('div','meta');

      if(r.language){
        const lang = el('span','lang');
        const dot = el('span','dot');
        dot.style.background = LANG_COLORS[r.language] || '#999';
        lang.appendChild(dot);
        lang.appendChild(document.createTextNode(r.language));
        meta.appendChild(lang);
      }
      meta.appendChild(el('span',null,'⭐ ' + r.stargazers_count));
      meta.appendChild(el('span',null,'🍴 ' + r.forks_count));
      meta.appendChild(el('span',null, timeAgo(r.pushed_at)));
      card.appendChild(meta);

      if(r.topics && r.topics.length){
        const tags = el('div','tags');
        r.topics.slice(0,4).forEach(t => tags.appendChild(el('span','tag','#'+t)));
        card.appendChild(tags);
      }

      box.appendChild(card);
    });
  }catch(e){
    box.innerHTML = '';
    box.appendChild(el('div','err', e.message));
  }
}

$('year').textContent = new Date().getFullYear();
loadRepos();
</script>
</body>
</html>
